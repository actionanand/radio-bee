<div class="tuner" [class.is-playing]="player.state()==='playing'" [attr.data-playback-state]="player.state()" [attr.lang]="data.locale()">
  <header>
    <div class="tuner-brand">
      <ion-icon [icon]="icons.radioOutline" aria-hidden="true" />
      <div>
        @if(compact()){
        <h2 id="home-title">RadioBee</h2>
        }@else{
        <h1 id="home-title">RadioBee</h1>
        }
        <p>Stay tuned. Stay buzzing.</p>
      </div>
    </div>
    <span class="tuner-state">{{ player.station() ? ui(player.statusLabel()) : ui('onlineRadio') }}</span>
  </header>
  <div class="segments" aria-hidden="true">
    @for(segment of segments;track segment){<span [class.amber]="segment>=16" [class.red]="segment>=21"></span>}
  </div>
  <div class="dial" aria-hidden="true">
    <div class="ticks"></div>
    <span class="marker"></span>
    <div class="scale"><span>RadioBee</span><span>{{ ui('onlineRadio') }}</span></div>
  </div>
</div>
