<ion-content
  ><div class="shell rb-ui">
    <div class="brand-bar">
      <a class="brand" routerLink="/home"
        ><img ngSrc="assets/icon/radio-bee.png" width="48" height="48" alt="" priority />
        <div>
          <strong>RadioBee<span class="brand-dot">.</span></strong>
          <p>Stay tuned. Stay buzzing.</p>
        </div></a
      ><span class="edition">{{ ui('edition') }}</span>
    </div>
    <div class="home-content">
      <section class="hero" aria-labelledby="home-title" [attr.lang]="data.locale()">
        <div class="hero-copy">
          <p class="eyebrow rb-eyebrow">{{ ui('heroEyebrow') }}</p>
          <h1 id="home-title">{{ ui('heroTitle') }}</h1>
          <p class="hero-description">{{ ui('heroDescription') }}</p>
          <div class="hero-signature">
            <span class="signal-dot" aria-hidden="true"></span> RadioBee <span aria-hidden="true">/</span> Stay tuned.
            Stay buzzing.
          </div>
        </div>
        <app-radio-illustration aria-hidden="true" />
      </section>
      <app-station-browser />
      <details class="development-lab" [hidden]="!liveTests">
        <summary>{{ ui('technicalTests') }}</summary>
        <app-live-stream-lab />
      </details>
    </div>
    <div class="site-footer">
      <strong>RadioBee<span class="brand-dot">.</span></strong>
      <p>Stay tuned. Stay buzzing.</p>
      <span>© RadioBee</span>
    </div>
  </div></ion-content
>
