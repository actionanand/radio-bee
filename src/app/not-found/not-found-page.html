<section class="lost-signal" aria-labelledby="lost-title">
  <div class="scene" data-signal-state="lost" role="img" [attr.aria-label]="ui('signalLostIllustration')">
    <svg class="radio" aria-hidden="true" focusable="false" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
      <text class="q" x="150" y="18">?</text>
      <text class="q q2" x="168" y="26">?</text>
      <text class="q q3" x="136" y="28">?</text>

      <g class="radio-body">
        <g class="antenna">
          <line x1="150" y1="40" x2="176" y2="6" stroke="var(--lost-ink)" stroke-width="3" stroke-linecap="round"/>
          <circle cx="176" cy="6" r="4" fill="var(--lost-ink)"/>
        </g>
        <rect x="14" y="40" width="172" height="92" rx="16" fill="var(--lost-radio-body)"/>
        <rect x="14" y="112" width="172" height="20" rx="10" fill="var(--lost-radio-dark)" opacity=".45"/>
        <rect x="14" y="40" width="172" height="92" rx="16" fill="none" stroke="var(--lost-ink)" stroke-width="3"/>
        <path d="M 40 40 Q 40 26 56 26 L 100 26 Q 116 26 116 40" fill="none" stroke="var(--lost-ink)" stroke-width="3" stroke-linecap="round"/>

        <circle cx="62" cy="86" r="30" fill="var(--lost-radio-panel)" stroke="var(--lost-ink)" stroke-width="3"/>
        <g class="static">
          <line x1="44" y1="70" x2="80" y2="70"/>
          <line x1="40" y1="78" x2="84" y2="78"/>
          <line x1="38" y1="86" x2="86" y2="86"/>
          <line x1="40" y1="94" x2="84" y2="94"/>
          <line x1="44" y1="102" x2="80" y2="102"/>
        </g>

        <rect x="104" y="54" width="72" height="26" rx="6" fill="var(--lost-radio-panel)" stroke="var(--lost-ink)" stroke-width="2.5"/>
        <g stroke="var(--lost-ink)" stroke-width="1.5" stroke-linecap="round">
          <line x1="112" y1="72" x2="112" y2="76"/><line x1="124" y1="72" x2="124" y2="76"/>
          <line x1="136" y1="72" x2="136" y2="76"/><line x1="148" y1="72" x2="148" y2="76"/>
          <line x1="160" y1="72" x2="160" y2="76"/><line x1="170" y1="72" x2="170" y2="76"/>
        </g>
        <g class="needle">
          <line x1="112" y1="58" x2="112" y2="77" stroke="#e5322d" stroke-width="2.5" stroke-linecap="round"/>
        </g>
        <text class="readout" x="140" y="98" text-anchor="middle">404 MHz</text>

        <circle cx="122" cy="112" r="9" fill="var(--lost-radio-panel)" stroke="var(--lost-ink)" stroke-width="2.5"/>
        <line class="knob-mark" x1="122" y1="112" x2="122" y2="105" stroke="var(--lost-ink)" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="156" cy="112" r="9" fill="var(--lost-radio-panel)" stroke="var(--lost-ink)" stroke-width="2.5"/>
        <line x1="156" y1="112" x2="161" y2="108" stroke="var(--lost-ink)" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </svg>

    <div class="bee" aria-hidden="true">
      <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" focusable="false">
        <ellipse class="wing back" cx="26" cy="22" rx="8" ry="14" fill="var(--lost-wing)" stroke="#7fb2dd" stroke-width="1"/>
        <ellipse class="wing" cx="33" cy="22" rx="8" ry="14" fill="var(--lost-wing)" stroke="#7fb2dd" stroke-width="1"/>
        <path d="M 8 32 L 2 32 L 8 35 Z" fill="var(--lost-bee-ink)"/>
        <ellipse cx="28" cy="33" rx="20" ry="13" fill="var(--lost-bee-yellow)" stroke="var(--lost-bee-ink)" stroke-width="2.5"/>
        <path d="M 22 21 Q 17 33 22 45" fill="none" stroke="var(--lost-bee-ink)" stroke-width="5"/>
        <path d="M 33 20.5 Q 28 33 33 45.5" fill="none" stroke="var(--lost-bee-ink)" stroke-width="5"/>
        <circle cx="50" cy="31" r="8" fill="var(--lost-bee-yellow)" stroke="var(--lost-bee-ink)" stroke-width="2.5"/>
        <circle cx="53" cy="29" r="2" fill="var(--lost-bee-ink)"/>
        <path d="M 52 36 Q 54 34 56 36" fill="none" stroke="var(--lost-bee-ink)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M 50 23 Q 50 16 56 14" fill="none" stroke="var(--lost-bee-ink)" stroke-width="2" stroke-linecap="round"/>
        <path d="M 46 24 Q 44 17 48 13" fill="none" stroke="var(--lost-bee-ink)" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <h1 class="code" id="lost-title" tabindex="-1">404</h1>
  <h2>{{ ui('signalLost') }}</h2>
  <p class="sub">{{ ui('missingFrequency') }}<span>{{ ui('lostBee') }}</span></p>
  <a class="btn" routerLink="/home">{{ ui('backToHome') }}</a>
</section>
