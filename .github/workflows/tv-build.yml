name: RadioBee Native TV Release
on:
  push:
    branches: [main-tv]
  workflow_dispatch:
    inputs:
      release:
        description: 'Authorize a signed TV release from main-tv only'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: radiobee-tv-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main-tv' && (github.event_name == 'push' || inputs.release == true)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main-tv
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate before allocating a version
        run: |
          node -e 'if(process.platform!=="linux")process.exit(1)'
          node --test scripts/tv-release.test.mjs
          python3 -B -m unittest discover -s scripts -p tv_artifacts_test.py
          cd android-tv
          ./gradlew --no-daemon --max-workers=2 lintDebug testDebugUnitTest assembleDebug
      - name: Persist a conflict-safe TV reservation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/reserve-tv-version.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {readTvVersion,tvReleaseName} from './scripts/tv-version.mjs';
          const version=readTvVersion();fs.appendFileSync(process.env.GITHUB_ENV,`TV_RELEASE=${tvReleaseName(version)}\n`);
          NODE
      - name: Build unsigned optimized TV APK, AAB and mapping
        working-directory: android-tv
        run: ./gradlew --no-daemon --max-workers=2 assembleRelease bundleRelease
      - name: Sign using the existing RadioBee Play identity
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: node scripts/sign-tv.mjs
      - name: Verify final TV artifacts
        run: |
          python3 scripts/validate-tv-artifacts.py --apk "releases/tv/${TV_RELEASE}.apk" --aab "releases/tv/${TV_RELEASE}.aab"
          test -s "releases/tv/${TV_RELEASE}-mapping.txt"
          {
            echo '## RadioBee TV release — signed and verified'
            echo "- Artifact: ${TV_RELEASE}"
            echo '- Application ID: com.actionanand.radiobee.app'
            echo '- TV namespace: com.actionanand.radiobee.tv'
            echo '- Target: Google TV / Android TV; no Google Play upload performed'
            echo "- Source plus reservation: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TV_RELEASE }}
          path: releases/tv/${{ env.TV_RELEASE }}*
          if-no-files-found: error
          retention-days: 30
      - name: Retain and commit only the verified TV release
        run: node scripts/publish-tv-artifacts.mjs
      - name: Clean owned temporary signing material
        if: always()
        run: node scripts/sign-tv.mjs --cleanup
