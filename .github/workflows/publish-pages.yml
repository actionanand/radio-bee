name: Publish RadioBee Web to gh-pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radiobee-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Test playback and catalogue integration
        run: npm run test:ci
      - name: Build production app for /radio-bee/
        run: npm run build:gh -- --configuration=production
      - name: Publish deep-link fallback
        run: |
          npm run copy-error-page
          cmp www/index.html www/404.html
          node scripts/check-web-artifact.mjs
      - name: Publish validated build to gh-pages
        shell: bash
        run: |
          git fetch origin gh-pages
          mkdir -p "$RUNNER_TEMP/radiobee-pages"
          git worktree add -B gh-pages "$RUNNER_TEMP/radiobee-pages" origin/gh-pages
          # Keep prior fingerprinted bundles for clients holding old HTML, but
          # compare file bytes rather than mtime+size. A cached Angular index
          # can have the same size/timestamp yet reference a different main JS.
          rsync -a --checksum --exclude=.git www/ "$RUNNER_TEMP/radiobee-pages/"
          # Fail closed if the outgoing GitHub Pages HTML is stale, even if
          # every referenced historical bundle still exists in the worktree.
          cmp www/index.html "$RUNNER_TEMP/radiobee-pages/index.html"
          cmp www/404.html "$RUNNER_TEMP/radiobee-pages/404.html"
          touch "$RUNNER_TEMP/radiobee-pages/.nojekyll"
          cd "$RUNNER_TEMP/radiobee-pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Force-add built assets, even if global/local gitignore rules apply.
          git add --force -A
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const html = fs.readFileSync('index.html', 'utf8');
          const refs = [...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)].map(x => x[1]);
          if (!refs.some(p => /^main-[^/]+\.js$/.test(p))) throw Error('Missing application entrypoint in index.html');
          for (const file of refs) {
            if (!fs.existsSync(file)) throw Error('Missing built asset: ' + file);
            const tracked = execFileSync('git', ['ls-files', '--cached', '--', file], { encoding: 'utf8' }).trim();
            if (tracked !== file) throw Error('Asset not included in deployment commit: ' + file);
          }
          console.log('Verified', refs.length, 'referenced JS/CSS assets in staged deployment');
          NODE
          if ! git diff --cached --quiet; then
            git commit -m "deploy: RadioBee web from ${GITHUB_SHA}"
          fi
          # Confirm the checked-out deployment commit contains THIS build's
          # entrypoint and fallback before pushing, not just any old entrypoint.
          cmp www/index.html <(git show HEAD:index.html)
          cmp www/404.html <(git show HEAD:404.html)
          # Check the outgoing tree, not just the worktree.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const html = fs.readFileSync('index.html', 'utf8');
          for (const [, file] of html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)) {
            execFileSync('git', ['cat-file', '-e', 'HEAD:' + file]);
          }
          NODE
          git push origin HEAD:gh-pages
