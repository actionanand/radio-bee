name: Publish RadioBee Web to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radiobee-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Test playback and catalogue integration
        run: npm run test:ci
      - name: Build production app for /radio-bee/
        run: npm run build:gh -- --configuration=production
      - name: Publish deep-link fallback
        run: |
          npm run copy-error-page
          cmp www/index.html www/404.html
          node scripts/check-web-artifact.mjs
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload production build
        uses: actions/upload-pages-artifact@v4
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
